name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo nextest run --workspace --locked
      - run: cargo test --doc --workspace --locked

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          components: llvm-tools-preview
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-lcov
          path: lcov.info

  bench:
    # Smoke-plus-detection: benches must build and run, and no suite may
    # regress beyond +30% vs the cached baseline.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install critcmp --locked --version 0.1.8
      - name: restore bench baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: bench-base.json
          key: bench-base-${{ github.run_id }}
          restore-keys: |
            bench-base-
      - run: cargo bench --workspace --locked --no-run
      - run: cargo bench -p ebpf-isa --locked --bench decode -- --save-baseline ci --measurement-time 5 --warm-up-time 0.5 --sample-size 30
      - run: cargo bench -p ebpf-cfg --locked --bench cfg -- --save-baseline ci --measurement-time 5 --warm-up-time 0.5 --sample-size 30
      - run: cargo bench -p ebpf-vm --locked --bench vm -- --save-baseline ci --measurement-time 5 --warm-up-time 0.5 --sample-size 30
      - run: cargo bench -p ebpf-verifier --locked --bench verify -- --save-baseline ci --measurement-time 5 --warm-up-time 0.5 --sample-size 30
      - run: cargo bench -p ebpf-ssa --locked --bench ssa -- --save-baseline ci --measurement-time 5 --warm-up-time 0.5 --sample-size 30
      - name: compare against baseline
        run: |
          critcmp --export ci > bench-new.json
          if [ -f bench-base.json ]; then critcmp bench-base.json bench-new.json; fi
          python3 .github/scripts/bench_gate.py bench-base.json bench-new.json --threshold 1.30
      - name: promote baseline
        if: success()
        run: cp bench-new.json bench-base.json
      - name: save bench baseline
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: bench-base.json
          key: bench-base-${{ github.run_id }}

  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace --locked

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  msrv-minimal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo +nightly update -Z minimal-versions -Z direct-minimal-versions
      - run: cargo check --workspace --all-targets

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3

  taplo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # No official taplo action exists; first-party prebuilt binary,
      - name: install taplo
        run: |
          curl -sSfL -o "$RUNNER_TEMP/taplo.gz" "https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz"
          gunzip -f "$RUNNER_TEMP/taplo.gz"
          chmod +x "$RUNNER_TEMP/taplo"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: taplo fmt --check

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install actionlint
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: actionlint -no-color

  dependency-review:
    # This repo pushes straight to main; this gates the day PRs arrive.
    # Licenses stay cargo-deny's single authority (no second allow-list
    # to drift); this job gates the vulnerability delta pre-merge.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
