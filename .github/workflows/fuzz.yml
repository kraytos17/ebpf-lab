name: fuzz
on:
  push:
    branches: [main]
    paths: ["crates/ebpf-isa/**", "crates/ebpf-cfg/**", "crates/ebpf-disasm/**", "crates/ebpf-verifier/**", "crates/ebpf-vm/**", "fuzz/**"]
  pull_request:
    paths: ["crates/ebpf-isa/**", "crates/ebpf-cfg/**", "crates/ebpf-disasm/**", "crates/ebpf-verifier/**", "crates/ebpf-vm/**", "fuzz/**"]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly fuzz build --target x86_64-unknown-linux-gnu

  run:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu decode_program -- -max_total_time=300
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu verify_pipeline -- -max_total_time=300
      - name: upload crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
