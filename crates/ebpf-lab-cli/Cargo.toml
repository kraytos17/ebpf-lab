[package]
name = "ebpf-lab-cli"
description = "ebpf-lab command-line interface: inspect, disassemble, verify, run, and optimize eBPF programs"
keywords = ["ebpf", "bpf", "cli"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ebpf-lab"
path = "src/main.rs"

[dependencies]
ebpf-isa.workspace = true
ebpf-elf.workspace = true
ebpf-disasm.workspace = true
ebpf-cfg.workspace = true
ebpf-vm.workspace = true
ebpf-verifier.workspace = true
ebpf-ssa.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Intentionally unused in code: pins the `lazy_static >= 1.4` floor
# graph-wide via version unification (see the workspace-deps comment).
# Do not remove — minimal-versions resolution would pick the uncompilable
# `lazy_static 1.0.0` allowed by `sharded-slab 0.1.4` and break MSRV.
lazy_static.workspace = true

[lints]
workspace = true
