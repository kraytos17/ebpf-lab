[package]
name = "ebpf-lab-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
ebpf-isa = { path = "../crates/ebpf-isa" }
ebpf-cfg = { path = "../crates/ebpf-cfg" }
ebpf-verifier = { path = "../crates/ebpf-verifier" }
ebpf-vm = { path = "../crates/ebpf-vm" }
ebpf-ssa = { path = "../crates/ebpf-ssa" }

[[bin]]
name = "decode_program"
path = "fuzz_targets/decode_program.rs"
test = false
doc = false

[[bin]]
name = "verify_pipeline"
path = "fuzz_targets/verify_pipeline.rs"
test = false
doc = false

[[bin]]
name = "ssa_pipeline"
path = "fuzz_targets/ssa_pipeline.rs"
test = false
doc = false

[workspace]
